global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'docuflow-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docuflow API
  - job_name: 'docuflow-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:9464']
        labels:
          service: 'docuflow-api'
          component: 'backend'

  # Docuflow Worker
  - job_name: 'docuflow-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:9464']
        labels:
          service: 'docuflow-worker'
          component: 'worker'

  # PostgreSQL Exporter (optional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis Exporter (optional)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # Node Exporter for host metrics (optional)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'
