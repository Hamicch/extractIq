apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docuflow-ingress
  namespace: docuflow
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - docuflow.example.com
    - api.docuflow.example.com
    secretName: docuflow-tls
  rules:
  - host: docuflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docuflow-web
            port:
              number: 3000
  - host: api.docuflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docuflow-api
            port:
              number: 3001
