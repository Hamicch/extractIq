apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuflow-web
  namespace: docuflow
  labels:
    app: docuflow-web
    component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docuflow-web
  template:
    metadata:
      labels:
        app: docuflow-web
        component: frontend
    spec:
      containers:
      - name: web
        image: ghcr.io/docuflow/docuflow-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.docuflow.example.com"
        - name: NEXT_PUBLIC_APP_URL
          value: "https://docuflow.example.com"
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docuflow-web
  namespace: docuflow
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: docuflow-web
