apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuflow-worker
  namespace: docuflow
  labels:
    app: docuflow-worker
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: docuflow-worker
  template:
    metadata:
      labels:
        app: docuflow-worker
        component: worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/docuflow/docuflow-worker:latest
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: docuflow-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: docuflow-config
              key: REDIS_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: docuflow-secrets
              key: OPENAI_API_KEY
        - name: WORKER_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: docuflow-config
              key: WORKER_CONCURRENCY
        - name: OTEL_SERVICE_NAME
          value: "docuflow-worker"
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
