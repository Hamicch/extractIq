# Render Blueprint for ExtractIQ
# Deploy to Render with one click: https://render.com

services:
  # Next.js Web Service (includes background worker)
  - type: web
    name: extractiq-web
    runtime: docker
    plan: starter # $7/month
    region: frankfurt # Change to oregon/singapore if needed
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: extractiq-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: extractiq-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: extractiq-redis
          property: port
      - key: OPENAI_API_KEY
        sync: false # Set in Render dashboard (secret)
      - key: JWT_SECRET
        generateValue: true # Auto-generate secure secret
      - key: API_KEY_SECRET
        generateValue: true # Auto-generate secure secret
      - key: NEXT_PUBLIC_APP_URL
        value: https://extractiq.xyz
      - key: CORS_ORIGIN
        value: https://extractiq.xyz
      # AI Provider Configuration (default: OpenAI GPT-4o-mini)
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      # Worker Configuration
      - key: WORKER_CONCURRENCY
        value: 5
      - key: WORKER_RATE_LIMIT_MAX
        value: 10
      - key: WORKER_RATE_LIMIT_DURATION
        value: 1000
      # Upload Configuration
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_FILE_SIZE
        value: 52428800 # 50MB
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: extractiq-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  # PostgreSQL Database
  - name: extractiq-db
    databaseName: extractiq
    plan: starter # $7/month
    region: frankfurt
    postgresMajorVersion: "15"

  # Redis (for BullMQ job queue)
  - name: extractiq-redis
    plan: starter # $10/month
    region: frankfurt
    ipAllowList: [] # Allow all (Render services are in private network)
