openapi: 3.1.0
info:
  title: Docuflow Document Intelligence API
  description: |
    Flow from upload to insight - AI-native document intelligence platform API.

    ## Authentication
    All endpoints require Bearer token authentication via the `Authorization` header.

    ## Rate Limiting
    API requests are rate limited per tenant. Rate limit information is included in response headers:
    - `X-RateLimit-Limit`: Maximum requests allowed per window
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when the rate limit resets

    ## Webhooks
    Configure webhooks to receive real-time notifications about document processing events.
  version: 1.0.0
  contact:
    name: Docuflow API Support
    email: api@docuflow.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.docuflow.io/v1
    description: Production
  - url: https://staging-api.docuflow.io/v1
    description: Staging
  - url: http://localhost:3001/v1
    description: Local Development

security:
  - bearerAuth: []

tags:
  - name: Documents
    description: Document upload, processing, and management
  - name: Tenants
    description: Multi-tenant administration
  - name: Webhooks
    description: Webhook configuration for event notifications
  - name: Analytics
    description: Usage analytics and reporting

paths:
  /tenants/{tenantId}/documents:
    post:
      summary: Upload a document for processing
      description: Upload a document file (max 50MB). Returns upload URL and documentId for tracking.
      operationId: uploadDocument
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, DOCX, TXT, MD)
                extractionConfig:
                  $ref: '#/components/schemas/ExtractionConfig'
                metadata:
                  type: object
                  additionalProperties: true
                  description: Custom metadata to attach to the document
      responses:
        '201':
          description: Document uploaded successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/QuotaExceeded'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: List documents
      description: Retrieve a paginated list of documents with filtering and sorting options.
      operationId: listDocuments
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: cursor
          in: query
          description: Cursor for pagination (returned in previous response)
          schema:
            type: string
        - name: limit
          in: query
          description: Number of documents to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by document status
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DocumentStatus'
          style: form
          explode: true
        - name: uploadedAfter
          in: query
          description: Filter documents uploaded after this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: uploadedBefore
          in: query
          description: Filter documents uploaded before this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          description: Field to sort by
          schema:
            type: string
            enum: [uploadedAt, processedAt, name, size]
            default: uploadedAt
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of documents retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenantId}/documents/{documentId}:
    get:
      summary: Get document details
      description: Retrieve full details for a specific document including metadata and processing status.
      operationId: getDocument
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document details retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a document
      description: Permanently delete a document and all associated data.
      operationId: deleteDocument
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Document deleted successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenantId}/documents/{documentId}/status:
    get:
      summary: Get document processing status
      description: Lightweight endpoint for polling document processing status.
      operationId: getDocumentStatus
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document status retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenantId}/documents/{documentId}/extracted-data:
    get:
      summary: Get extracted data
      description: Retrieve structured data extracted from the document.
      operationId: getExtractedData
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Extracted data retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Document processing not completed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Update extracted data
      description: Update or correct extracted field values.
      operationId: updateExtractedData
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractedDataUpdate'
      responses:
        '200':
          description: Extracted data updated successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenantId}/webhooks:
    post:
      summary: Configure webhook
      description: Set up webhook URL to receive document processing event notifications.
      operationId: createWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfig'
      responses:
        '201':
          description: Webhook configured successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenantId}/analytics:
    get:
      summary: Get analytics
      description: Retrieve usage statistics, costs, and success rates for the tenant.
      operationId: getAnalytics
      tags:
        - Analytics
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: startDate
          in: query
          description: Start date for analytics period (ISO 8601)
          required: true
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: End date for analytics period (ISO 8601)
          required: true
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          description: Data granularity
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
      responses:
        '200':
          description: Analytics data retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants:
    get:
      summary: List all tenants (Admin only)
      description: Retrieve a list of all tenants. Requires admin privileges.
      operationId: listTenants
      tags:
        - Tenants
      parameters:
        - name: cursor
          in: query
          description: Cursor for pagination
          schema:
            type: string
        - name: limit
          in: query
          description: Number of tenants to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of tenants retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: tenantId
      in: path
      description: Unique tenant identifier
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: documentId
      in: path
      description: Unique document identifier
      required: true
      schema:
        type: string
        format: uuid

  headers:
    X-RateLimit-Limit:
      description: Maximum requests allowed per window
      schema:
        type: integer
        example: 1000

    X-RateLimit-Remaining:
      description: Remaining requests in current window
      schema:
        type: integer
        example: 999

    X-RateLimit-Reset:
      description: Unix timestamp when rate limit resets
      schema:
        type: integer
        format: int64
        example: 1704067200

  schemas:
    DocumentStatus:
      type: string
      enum:
        - uploading
        - queued
        - processing
        - completed
        - failed
      description: Current processing status of the document

    ExtractionConfig:
      type: object
      properties:
        fields:
          type: array
          description: Specific fields to extract (optional, uses AI auto-detection if not specified)
          items:
            type: string
          example: ["invoice_number", "total_amount", "date", "vendor"]
        language:
          type: string
          description: Document language (ISO 639-1 code)
          default: en
          example: en
        customPrompt:
          type: string
          description: Custom extraction instructions for AI
          example: "Extract all financial figures and highlight any discrepancies"

    Document:
      type: object
      required:
        - id
        - tenantId
        - name
        - size
        - mimeType
        - status
        - uploadedAt
        - s3Key
      properties:
        id:
          type: string
          format: uuid
          description: Unique document identifier
        tenantId:
          type: string
          format: uuid
          description: Tenant that owns this document
        name:
          type: string
          description: Original filename
          example: "invoice-2024-001.pdf"
        size:
          type: integer
          format: int64
          description: File size in bytes
          example: 2048576
        mimeType:
          type: string
          description: MIME type of the document
          example: "application/pdf"
        status:
          $ref: '#/components/schemas/DocumentStatus'
        uploadedAt:
          type: string
          format: date-time
          description: Upload timestamp (ISO 8601)
        processedAt:
          type: string
          format: date-time
          description: Processing completion timestamp (ISO 8601)
        s3Key:
          type: string
          description: S3 storage key
        downloadUrl:
          type: string
          format: uri
          description: Pre-signed URL for downloading the document (expires in 1 hour)
        metadata:
          type: object
          additionalProperties: true
          description: Custom metadata attached to the document
        extractionConfig:
          $ref: '#/components/schemas/ExtractionConfig'
        error:
          $ref: '#/components/schemas/ProcessingError'

    ProcessingError:
      type: object
      properties:
        code:
          type: string
          example: "UNSUPPORTED_FORMAT"
        message:
          type: string
          example: "Document format not supported for extraction"
        details:
          type: object
          additionalProperties: true

    DocumentUploadResponse:
      type: object
      required:
        - documentId
        - uploadUrl
        - expiresAt
      properties:
        documentId:
          type: string
          format: uuid
          description: Unique identifier for the uploaded document
        uploadUrl:
          type: string
          format: uri
          description: Pre-signed S3 URL for file upload
        expiresAt:
          type: string
          format: date-time
          description: Upload URL expiration time
        status:
          $ref: '#/components/schemas/DocumentStatus'

    DocumentStatusResponse:
      type: object
      required:
        - documentId
        - status
      properties:
        documentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DocumentStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Processing progress percentage
        estimatedCompletionAt:
          type: string
          format: date-time
          description: Estimated completion time
        error:
          $ref: '#/components/schemas/ProcessingError'

    DocumentListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    CursorPagination:
      type: object
      required:
        - hasNext
        - hasPrev
      properties:
        nextCursor:
          type: string
          description: Cursor for next page (null if no next page)
          nullable: true
        prevCursor:
          type: string
          description: Cursor for previous page (null if no previous page)
          nullable: true
        hasNext:
          type: boolean
          description: Whether there is a next page
        hasPrev:
          type: boolean
          description: Whether there is a previous page
        nextUrl:
          type: string
          format: uri
          description: Full URL for next page
          nullable: true
        prevUrl:
          type: string
          format: uri
          description: Full URL for previous page
          nullable: true

    ExtractedData:
      type: object
      required:
        - documentId
        - extractedAt
        - fields
        - confidence
      properties:
        documentId:
          type: string
          format: uuid
        extractedAt:
          type: string
          format: date-time
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExtractedField'
          description: Key-value pairs of extracted data
        rawText:
          type: string
          description: Full extracted text from document
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Overall extraction confidence score
        pageCount:
          type: integer
          description: Number of pages processed

    ExtractedField:
      type: object
      required:
        - value
        - confidence
      properties:
        value:
          description: Extracted field value (can be string, number, boolean, or object)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score for this field
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        page:
          type: integer
          description: Page number where field was found

    BoundingBox:
      type: object
      description: Coordinates of the field in the document
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: float
        width:
          type: number
          format: float
        height:
          type: number
          format: float

    ExtractedDataUpdate:
      type: object
      required:
        - fields
      properties:
        fields:
          type: object
          additionalProperties: true
          description: Fields to update with new values

    WebhookConfig:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL to receive webhook events
          example: "https://api.example.com/webhooks/docuflow"
        events:
          type: array
          description: Events to subscribe to
          items:
            type: string
            enum:
              - document.processing.completed
              - document.processing.failed
              - document.uploaded
              - document.deleted
          minItems: 1
        secret:
          type: string
          description: Secret for webhook signature verification (optional)
        enabled:
          type: boolean
          default: true

    Webhook:
      allOf:
        - $ref: '#/components/schemas/WebhookConfig'
        - type: object
          required:
            - id
            - tenantId
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            tenantId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            lastTriggeredAt:
              type: string
              format: date-time
              nullable: true

    WebhookPayload:
      type: object
      required:
        - event
        - timestamp
        - data
      properties:
        event:
          type: string
          description: Event type
          example: "document.processing.completed"
        timestamp:
          type: string
          format: date-time
          description: Event timestamp
        data:
          type: object
          description: Event-specific data
        signature:
          type: string
          description: HMAC signature for verification

    DocumentProcessingCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookPayload'
        - type: object
          properties:
            data:
              type: object
              required:
                - documentId
                - tenantId
                - status
              properties:
                documentId:
                  type: string
                  format: uuid
                tenantId:
                  type: string
                  format: uuid
                status:
                  $ref: '#/components/schemas/DocumentStatus'
                processedAt:
                  type: string
                  format: date-time
                extractedDataUrl:
                  type: string
                  format: uri

    DocumentProcessingFailedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookPayload'
        - type: object
          properties:
            data:
              type: object
              required:
                - documentId
                - tenantId
                - error
              properties:
                documentId:
                  type: string
                  format: uuid
                tenantId:
                  type: string
                  format: uuid
                error:
                  $ref: '#/components/schemas/ProcessingError'
                failedAt:
                  type: string
                  format: date-time

    Analytics:
      type: object
      required:
        - period
        - metrics
      properties:
        period:
          type: object
          required:
            - startDate
            - endDate
            - granularity
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
            granularity:
              type: string
              enum: [hour, day, week, month]
        metrics:
          type: object
          required:
            - documentsProcessed
            - totalCost
            - successRate
          properties:
            documentsProcessed:
              type: integer
              description: Total documents processed in period
            totalCost:
              type: number
              format: float
              description: Total processing cost (USD)
            successRate:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Success rate (0-1)
            averageProcessingTime:
              type: number
              format: float
              description: Average processing time in seconds
            totalPages:
              type: integer
              description: Total pages processed
        timeSeries:
          type: array
          description: Time-series data points
          items:
            type: object
            required:
              - timestamp
              - count
            properties:
              timestamp:
                type: string
                format: date-time
              count:
                type: integer
              cost:
                type: number
                format: float
              successCount:
                type: integer
              failureCount:
                type: integer

    Tenant:
      type: object
      required:
        - id
        - name
        - createdAt
        - plan
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Acme Corporation"
        createdAt:
          type: string
          format: date-time
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
        quota:
          $ref: '#/components/schemas/TenantQuota'
        usage:
          $ref: '#/components/schemas/TenantUsage'

    TenantQuota:
      type: object
      required:
        - maxDocumentsPerMonth
        - maxStorageGB
      properties:
        maxDocumentsPerMonth:
          type: integer
          example: 1000
        maxStorageGB:
          type: integer
          example: 100
        maxRequestsPerMinute:
          type: integer
          example: 100

    TenantUsage:
      type: object
      required:
        - documentsThisMonth
        - storageUsedGB
      properties:
        documentsThisMonth:
          type: integer
        storageUsedGB:
          type: number
          format: float
        requestsThisMinute:
          type: integer

    TenantListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "Invalid request parameters"
            details:
              type: object
              additionalProperties: true
              description: Additional error context
            field:
              type: string
              description: Field that caused the error (for validation errors)

    QuotaExceededError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  example: "QUOTA_EXCEEDED"
                quota:
                  $ref: '#/components/schemas/TenantQuota'
                usage:
                  $ref: '#/components/schemas/TenantUsage'
                upgradeUrl:
                  type: string
                  format: uri
                  description: URL to upgrade plan

  responses:
    BadRequest:
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Invalid request parameters"
              details:
                field: "file"
                issue: "File size exceeds maximum allowed"

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Invalid or expired authentication token"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "FORBIDDEN"
              message: "Insufficient permissions to access this resource"

    NotFound:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "NOT_FOUND"
              message: "Document not found"

    QuotaExceeded:
      description: Payment required - Tenant quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaExceededError'
          example:
            error:
              code: "QUOTA_EXCEEDED"
              message: "Monthly document processing quota exceeded"
              quota:
                maxDocumentsPerMonth: 1000
                maxStorageGB: 100
              usage:
                documentsThisMonth: 1000
                storageUsedGB: 85.3
              upgradeUrl: "https://docuflow.io/upgrade"

    PayloadTooLarge:
      description: Payload too large - File exceeds maximum size (50MB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "PAYLOAD_TOO_LARGE"
              message: "File size exceeds maximum allowed (50MB)"
              details:
                maxSize: 52428800
                actualSize: 62914560

    TooManyRequests:
      description: Too many requests - Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Seconds until rate limit resets
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "RATE_LIMIT_EXCEEDED"
              message: "Rate limit exceeded. Please retry after 60 seconds"
              details:
                retryAfter: 60
                limit: 100
                window: "1 minute"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "An unexpected error occurred. Please try again later"
