name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npx turbo run build --filter=@docuflow/shared --filter=@docuflow/db

      - name: Build API package
        run: npx turbo run build --filter=@docuflow/api

      - name: Run API unit tests
        run: npx turbo run test --filter=@docuflow/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docuflow_test
          REDIS_URL: redis://localhost:6379

      - name: Build Worker package
        run: npx turbo run build --filter=@docuflow/worker

      - name: Run Worker unit tests
        run: npx turbo run test --filter=@docuflow/worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docuflow_test
          REDIS_URL: redis://localhost:6379

      - name: Upload API coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/api/coverage/coverage-final.json
          flags: api
          name: api-coverage

      - name: Upload Worker coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/worker/coverage/coverage-final.json
          flags: worker
          name: worker-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npx turbo run build --filter=@docuflow/shared --filter=@docuflow/db --filter=@docuflow/ui

      - name: Run frontend tests
        run: npx turbo run test --filter=@docuflow/web

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/web/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run type check
        run: npm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests with coverage
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docuflow_test
          REDIS_URL: redis://localhost:6379

      - name: Check backend coverage threshold (80%)
        run: |
          API_COVERAGE=$(cat packages/api/coverage/coverage-summary.json | jq '.total.lines.pct')
          WORKER_COVERAGE=$(cat packages/worker/coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "API Coverage: $API_COVERAGE%"
          echo "Worker Coverage: $WORKER_COVERAGE%"
          if (( $(echo "$API_COVERAGE < 80" | bc -l) )); then
            echo "❌ API coverage $API_COVERAGE% is below 80% threshold"
            exit 1
          fi
          if (( $(echo "$WORKER_COVERAGE < 80" | bc -l) )); then
            echo "❌ Worker coverage $WORKER_COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "✅ Backend coverage meets threshold"

      - name: Check frontend coverage threshold (70%)
        run: |
          WEB_COVERAGE=$(cat packages/web/coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Web Coverage: $WEB_COVERAGE%"
          if (( $(echo "$WEB_COVERAGE < 70" | bc -l) )); then
            echo "❌ Frontend coverage $WEB_COVERAGE% is below 70% threshold"
            exit 1
          fi
          echo "✅ Frontend coverage meets threshold"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          test -d packages/api/dist && echo "✅ API built"
          test -d packages/worker/dist && echo "✅ Worker built"
          test -d packages/web/.next && echo "✅ Web built"
          test -d packages/shared/dist && echo "✅ Shared built"
          test -d packages/db/dist && echo "✅ DB built"
